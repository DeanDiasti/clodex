[package]
name = "clodex"
version = "0.1.0"
edition = "2024"
description = "Run Claude Code as a harness for subscription-backed Codex models"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
tokio = { version = "1.47", features = ["net", "rt", "sync", "time"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4"
