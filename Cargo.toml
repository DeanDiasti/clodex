[package]
name = "clodex"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Use Claude Code's agentic interface with subscription-backed Codex models"
license = "MIT"
repository = "https://github.com/DeanDiasti/clodex"
homepage = "https://github.com/DeanDiasti/clodex"
readme = "README.md"
keywords = ["claude-code", "codex", "cli", "ai", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
tokio = { version = "1.47", features = ["net", "rt", "sync", "time"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4"
tokio = { version = "1.47", features = ["macros", "rt"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
